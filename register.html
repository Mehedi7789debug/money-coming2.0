<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — MONEY COMING</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">MC</div>
      <h1>Create account</h1><p class="muted">One account. Verified rewards.</p>
      <form id="registerForm" novalidate>
        <label>Username<input id="username" type="text" minlength="3" maxlength="30" required></label>
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" required></label>
        <label>Referral Code (optional)<input id="referralCode" type="text" maxlength="40"></label>
        <button class="btn btn-primary btn-full" type="submit">CREATE ACCOUNT</button>
      </form>
      <p class="auth-footer">Already registered? <a href="login.html">Login</a></p>
    </section>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
