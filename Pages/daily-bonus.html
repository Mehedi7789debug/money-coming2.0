<!-- ===================================================== DAILY BONUS
     Seven-day cycle; reward amount is decided by Cloud Functions.
===================================================== -->
<section>
  <div class="section-title"><h2>Daily Bonus</h2></div>
  <article class="card">
    <p class="muted">Claim once per server calendar day. The backend calculates your streak and reward.</p>
    <div class="grid grid-3">
      <div class="card stat-card"><div class="stat-label">Day 1</div><div class="stat-value">20</div></div>
      <div class="card stat-card"><div class="stat-label">Day 4</div><div class="stat-value">40</div></div>
      <div class="card stat-card"><div class="stat-label">Day 7</div><div class="stat-value">100</div></div>
    </div>
    <button id="claimBonus" class="btn btn-primary btn-full" type="button">CLAIM DAILY BONUS</button>
    <h3 id="bonusResult" style="text-align:center"></h3>
  </article>
</section>
