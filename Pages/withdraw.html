<!-- ===================================================== WITHDRAWAL PAGE
     Token conversion and payment request UI. Backend performs final validation.
===================================================== -->
<section>
  <div class="section-title"><h2>Withdraw</h2></div>
  <article class="card">
    <div class="grid grid-2">
      <div><div class="muted">Available Tokens</div><strong id="availableTokens">0</strong></div>
      <div><div class="muted">Default Rate</div><strong>200 Tokens = 1 BDT</strong></div>
    </div>
    <p class="muted">Minimum withdrawal: 10,000 tokens. Payment numbers are protected and masked in history.</p>
  </article>
  <div class="section-title"><h2>Request Payment</h2></div>
  <article class="card">
    <form id="withdrawForm">
      <label>Payment Method<select name="method" required><option value="bKash">bKash</option><option value="Nagad">Nagad</option><option value="Rocket">Rocket</option></select></label>
      <label>Payment Number<input name="paymentNumber" inputmode="numeric" minlength="11" maxlength="14" required></label>
      <label>Withdrawal Amount (Tokens)<input name="amount" type="number" min="10000" step="1" required></label>
      <button class="btn btn-primary btn-full" type="submit">REQUEST PAYMENT</button>
    </form>
  </article>
</section>
