<!-- ===================================================== SETTINGS
     Account preferences and safe Firebase actions.
===================================================== -->
<section>
  <div class="section-title"><h2>Settings</h2></div>
  <div class="grid">
    <article class="card action-card"><div class="action-icon">🔔</div><div><h3>Notifications</h3><p>Persistent notifications are stored in Firebase.</p></div></article>
    <button id="resetPassword" class="card action-card" type="button" style="text-align:left;border:1px solid var(--border)"><div class="action-icon">🔐</div><div><h3>Password Reset</h3><p>Send a secure Firebase reset email</p></div></button>
    <button id="logoutSettings" class="btn btn-danger" type="button">LOGOUT</button>
  </div>
</section>
