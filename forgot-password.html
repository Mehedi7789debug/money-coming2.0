<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — MONEY COMING</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">MC</div>
      <h1>Reset password</h1><p class="muted">We will send a secure reset link to your email.</p>
      <form id="resetForm">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <button class="btn btn-primary btn-full" type="submit">SEND RESET LINK</button>
      </form>
      <p class="auth-footer"><a href="login.html">Back to login</a></p>
    </section>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
